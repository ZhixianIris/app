name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Ban scan — source tree, manifest and lockfile
        # The checker is fail-closed: banned content exits 1, scanner errors
        # exit 2 — both fail this step. Only a clean scan exits 0.
        run: node scripts/check-bans.mjs src public tests scripts package.json index.html vite.config.ts package-lock.json

      - name: Build
        run: npm run build

      - name: Ban scan — production bundle
        run: node scripts/check-bans.mjs --dist dist

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: Browser smoke (production bundle)
        run: npx playwright test
        env:
          CI: true

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            e2e-artifacts/
            playwright-report/
          retention-days: 14
